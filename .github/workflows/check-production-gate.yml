name: Check production gate only (temporary)
on:
  push:
    branches: [test/producthunt-e2e-20261106]
    paths: [".github/workflows/check-production-gate.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect boolean only without reading sensitive values
        env:
          GATE_ENABLED: ${{ vars.PRODUCTHUNT_PRODUCTION_ENABLED == 'true' }}
          GATE_DISABLED: ${{ vars.PRODUCTHUNT_PRODUCTION_ENABLED == 'false' }}
        run: |
          echo "PRODUCTHUNT_PRODUCTION_GATE_ENABLED=$GATE_ENABLED"
          echo "PRODUCTHUNT_PRODUCTION_GATE_EXPLICITLY_DISABLED=$GATE_DISABLED"
