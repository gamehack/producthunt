name: Product Hunt Daily

run-name: Product Hunt daily ${{ github.event.inputs.snapshot_date || 'latest completed day' }}

on:
  schedule:
    # 09:00 UTC = 17:00 Asia/Shanghai (Beijing time).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Product Hunt date in America/Los_Angeles; leave blank for the latest completed day"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: producthunt-daily
  cancel-in-progress: false

jobs:
  produce-notion-ready:
    # Keep the schedule dormant until the old producer is retired. Manual E2E runs remain available.
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTHUNT_PRODUCTION_ENABLED == 'true'
    name: Research products and create Notion READY article
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
      PRODUCT_HUNT_COMMERCIAL_AUTHORIZED: ${{ secrets.PRODUCT_HUNT_COMMERCIAL_AUTHORIZED }}
      OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_MODEL: ${{ vars.OMNIROUTE_MODEL || 'minimax-m3' }}
      NOTION_ENABLE_SYNC: "true"
      NOTION_AUTOSYNC_AFTER_GENERATION: "true"
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_PARENT_PAGE_ID: "4109e605-ccf8-81c4-accd-c19386b4a38d"
      PRODUCTHUNT_SOURCE: producthunt
      PRODUCTHUNT_DB_PATH: data/producthunt.sqlite
      PRODUCTHUNT_OUTPUT_DIR: output
      PRODUCTHUNT_OPPORTUNITY_THRESHOLD: "60"
      PRODUCTHUNT_MAX_RESEARCH: "5"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve Product Hunt snapshot date
        id: snapshot
        env:
          REQUESTED_DATE: ${{ github.event.inputs.snapshot_date || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          import os

          requested = os.environ.get("REQUESTED_DATE", "").strip()
          if requested:
              snapshot = date.fromisoformat(requested)
              if snapshot.isoformat() != requested:
                  raise SystemExit("snapshot_date must use YYYY-MM-DD")
          else:
              snapshot = datetime.now(ZoneInfo("America/Los_Angeles")).date() - timedelta(days=1)
          print(f"date={snapshot.isoformat()}")
          PY
          mkdir -p data output

      - name: Restore same-day resumable checkpoints
        uses: actions/cache@v4
        with:
          path: |
            data/producthunt.sqlite
            data/producthunt.sqlite-shm
            data/producthunt.sqlite-wal
            output/${{ steps.snapshot.outputs.date }}
          key: producthunt-${{ steps.snapshot.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            producthunt-${{ steps.snapshot.outputs.date }}-

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate required configuration
        env:
          REQUIRED_VALUES: ${{ secrets.PRODUCT_HUNT_TOKEN != '' && secrets.PRODUCT_HUNT_COMMERCIAL_AUTHORIZED == 'true' && secrets.OMNIROUTE_BASE_URL != '' && secrets.OMNIROUTE_API_KEY != '' && secrets.NOTION_API_KEY != '' }}
        run: |
          if [[ "$REQUIRED_VALUES" != "true" ]]; then
            echo "::error::Missing GitHub Actions secrets or Product Hunt commercial authorization."
            exit 1
          fi
          python - <<'PY'
          from urllib.parse import urlsplit
          import os

          endpoint = urlsplit(os.environ["OMNIROUTE_BASE_URL"])
          if endpoint.scheme != "https" or not endpoint.hostname or endpoint.username or endpoint.password:
              raise SystemExit("OMNIROUTE_BASE_URL must be an HTTPS endpoint reachable from GitHub-hosted runners")
          PY

      - name: Produce article and verify Notion READY
        env:
          SNAPSHOT_DATE: ${{ steps.snapshot.outputs.date }}
        run: producthunt run --date "$SNAPSHOT_DATE"

      - name: Publish run summary
        if: success()
        env:
          SNAPSHOT_DATE: ${{ steps.snapshot.outputs.date }}
        run: |
          {
            echo "## Product Hunt production succeeded"
            echo
            echo "- Snapshot date (America/Los_Angeles): $SNAPSHOT_DATE"
            echo "- Notion destination: 08 · 潜界 AI｜产品猎人日报"
            echo "- READY marker and SHA-256 readback: verified by the producer"
            echo "- Channel publishing: not performed; qjai-text-publisher remains responsible"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve recovery files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: producthunt-recovery-${{ steps.snapshot.outputs.date }}
          path: output/${{ steps.snapshot.outputs.date }}/
          if-no-files-found: ignore
          retention-days: 7
