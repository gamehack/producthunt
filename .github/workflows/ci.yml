name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m compileall -q src tests
      - name: Assert producer has no channel delivery implementation
        run: |
          if grep -R -n -E 'api\.weixin\.qq\.com|WECHAT_APP_ID|CMS_INGEST_TOKEN|sync-cms|draft/add' src; then
            echo "Channel delivery code is forbidden in this repository"; exit 1
          fi
      - name: Assert production uses GitHub Actions only
        run: |
          test -f .github/workflows/daily.yml
          grep -Fq 'cron: "0 9 * * *"' .github/workflows/daily.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/daily.yml
          grep -Fq "vars.PRODUCTHUNT_PRODUCTION_ENABLED == 'true'" .github/workflows/daily.yml
          grep -Fq 'NOTION_AUTOSYNC_AFTER_GENERATION: "true"' .github/workflows/daily.yml
          test ! -e Dockerfile
          test ! -e compose.yaml
          test ! -e deploy/systemd
          test ! -e scripts/manage-systemd.sh
