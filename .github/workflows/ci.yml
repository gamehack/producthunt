name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m compileall -q src tests
      - run: bash -n scripts/verify-docker.sh scripts/manage-systemd.sh
      - name: Assert producer has no channel delivery implementation
        run: |
          if grep -R -n -E 'api\.weixin\.qq\.com|WECHAT_APP_ID|CMS_INGEST_TOKEN|sync-cms|draft/add' src; then
            echo "Channel delivery code is forbidden in this repository"; exit 1
          fi
      - run: systemd-analyze calendar '*-*-* 17:00:00 Asia/Shanghai'
