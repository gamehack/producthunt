[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qjai-producthunt"
version = "1.0.0"
description = "Product Hunt opportunity research into verified Notion READY articles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.2.0",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
producthunt = "qjai_producthunt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qjai_producthunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
